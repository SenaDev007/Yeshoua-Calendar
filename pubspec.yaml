name: yeshua_calendar
description: >-
  Horloge Céleste — Le temps de l’alliance de l’Éternel (Yeshua Calendar).
  Calendrier biblique de 364 jours (règles identiques au calendrier déjà
  implémenté dans Yeshua Connect Mobile), horloge divine, trois veilles de
  la nuit, douze heures saisonnières, alarmes spirituelles RHEMA.
  Calculs astronomiques 100 % embarqués — fonctionne hors connexion.
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Moteur Horloge Céleste — pur Dart, testé indépendamment (113 tests, dont parité
  # 100 % avec le calendrier du backend Mouvement Christ Libère).
  horloge_celeste_engine:
    path: packages/horloge_celeste_engine

  # Gestion d'état — mêmes versions que yeshua-connect-mobile.
  flutter_riverpod: ^2.5.1

  # Persistance légère (position, préférences d'alarmes, état temporel).
  shared_preferences: ^2.3.2

  # Localisation (§9.1) — ponctuelle, jamais permanente.
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Alarmes spirituelles (§8) — notifications locales natives.
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Aperçu instantané des sonneries (taper sur un mode l'écoute aussitôt).
  audioplayers: ^6.1.0
  # Vibration réelle — fonctionne même téléphone en silencieux (§8.4).
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo-horloge-celeste.png
    - assets/images/logo-horloge-celeste-anime.webp
    - assets/images/saison-printemps.jpg
    - assets/images/saison-ete.jpg
    - assets/images/saison-automne.jpg
    - assets/images/saison-hiver.jpg
    - assets/images/saison-printemps-2.jpg
    - assets/images/saison-ete-2.jpg
    - assets/images/saison-automne-2.jpg
    - assets/images/saison-hiver-2.jpg
    - assets/images/periode-jour.gif
    - assets/images/periode-nuit.gif
    - assets/images/cadran-biblique-fond.png
    - assets/sounds/shofar.mp3
    - assets/sounds/cloche.mp3
    - assets/sounds/harpe.mp3
