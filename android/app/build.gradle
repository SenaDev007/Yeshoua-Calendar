plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '4'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.2'

// Clé de signature Play Store (upload key) — android/key.properties,
// hors dépôt Git (.gitignore). Sans ce fichier, retour à la signature debug
// pour les builds locaux ; `flutter build appbundle` signe avec la clé d'upload.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.yehiortech.horlogeceleste"
    // SDK 36 requis par geolocator_android et shared_preferences_android
    // (checkReleaseAarMetadata) — aligné avec targetSdk 36 (exigence Play, API 36).
    compileSdk 36

    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // flutter_local_notifications exige le desugaring des bibliothèques
        // java.time (checkReleaseAarMetadata).
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    defaultConfig {
        applicationId "com.yehiortech.horlogeceleste"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // App intégralement française — ressources FR uniquement (APK allégé).
        resourceConfigurations += ["fr"]
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Clé d'upload Play Store si key.properties est présent,
            // signature debug sinon (builds locaux sans keystore).
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Desugaring java.time pour flutter_local_notifications (§8).
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
